<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Miles Cocktail Lounge Barcelona en vídeo: ambiente, cócteles y la sala privatizable In Confidence. 30 segundos.">

<link rel="canonical" href="https://inconfidencebymiles.com/video">

<link rel="icon" href="/favicon-192.png" sizes="192x192" type="image/png">

<!-- Open Graph -->
<meta property="og:type" content="video.other">

<meta property="og:description" content="30 segundos de ambiente Miles: cócteles, bar y la sala privatizable In Confidence.">

<style>
:root {
  --color-bg: #0C0A08;
  --color-red: #A0151C;
  --color-gold: #D4A85A;
  --color-gold-light: #E7BE78;
  --color-cream: #E8E0D0;
  --color-cream-dim: rgba(232, 224, 208, 0.65);
  --font-display: 'Zodiak', 'Georgia', serif;
  --font-body: 'General Sans', 'Helvetica Neue', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--color-bg);
  color: var(--color-cream);
  font-family: var(--font-body);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem 1rem;
  overflow-x: hidden;
}

/* Ambient background glow */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse at center, rgba(160, 21, 28, 0.15) 0%, transparent 60%);
  pointer-events: none;
  z-index: 0;
}

.container {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1.75rem;
  max-width: 720px;
  width: 100%;
}

.back-link {
  position: fixed;
  top: 1.5rem;
  left: 1.5rem;
  color: var(--color-cream-dim);
  text-decoration: none;
  font-size: 0.85rem;
  letter-spacing: 0.05em;
  transition: color 0.2s;
  z-index: 10;
}
.back-link:hover { color: var(--color-gold); }

.brand {
  font-family: var(--font-display);
  font-size: clamp(1.5rem, 3vw, 2rem);
  color: var(--color-cream);
  letter-spacing: 0.02em;
  text-align: center;
}
.brand__accent {
  color: var(--color-gold);
  font-style: italic;
}

.subtitle {
  font-size: 0.85rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--color-cream-dim);
  text-align: center;
}

.video-wrap {
  position: relative;
  width: 100%;
  max-width: 380px;
  aspect-ratio: 9 / 16;
  border-radius: 16px;
  overflow: hidden;
  background: #000;
  box-shadow:
    0 0 0 1px rgba(212, 168, 90, 0.15),
    0 20px 60px rgba(0, 0, 0, 0.6),
    0 0 80px rgba(160, 21, 28, 0.2);
}

.video-wrap video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* Overlay 'Activer le son' */
.sound-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(ellipse at center, rgba(12,10,8,0.15) 0%, rgba(12,10,8,0.35) 70%, rgba(12,10,8,0.55) 100%);
  cursor: pointer;
  transition: opacity 0.4s ease;
  z-index: 2;
  border: 0;
  padding: 0;
  color: inherit;
  font: inherit;
}
.sound-overlay:hover .sound-overlay__pill {
  background: var(--color-gold);
  color: #020202;
  border-color: var(--color-gold);
  transform: scale(1.03);
}
.sound-overlay.is-hidden {
  opacity: 0;
  pointer-events: none;
}
.sound-overlay__pill {
  display: inline-flex;
  align-items: center;
  gap: 0.55rem;
  padding: 0.85rem 1.4rem;
  border-radius: 999px;
  background: rgba(12, 10, 8, 0.75);
  border: 1px solid rgba(212, 168, 90, 0.5);
  color: var(--color-cream);
  font-size: 0.88rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  box-shadow: 0 6px 20px rgba(0,0,0,0.5), 0 0 40px rgba(160, 21, 28, 0.2);
  transition: all 0.25s ease;
}
.sound-overlay__icon {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
}

.cta-row {
  display: flex;
  gap: 0.75rem;
  flex-wrap: wrap;
  justify-content: center;
  margin-top: 0.5rem;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.85rem 1.5rem;
  border-radius: 999px;
  text-decoration: none;
  font-size: 0.9rem;
  letter-spacing: 0.03em;
  font-weight: 500;
  transition: all 0.2s ease;
  border: 1px solid transparent;
  cursor: pointer;
}
.btn--primary {
  background: var(--color-gold);
  color: #020202;
}
.btn--primary:hover {
  background: var(--color-gold-light);
  transform: translateY(-1px);
}
.btn--ghost {
  color: var(--color-cream);
  border-color: rgba(232, 224, 208, 0.3);
}
.btn--ghost:hover {
  border-color: var(--color-gold);
  color: var(--color-gold);
}

.foot {
  margin-top: 1rem;
  font-size: 0.72rem;
  letter-spacing: 0.08em;
  color: rgba(232, 224, 208, 0.4);
  text-align: center;
}

@media (max-width: 600px) {
  .back-link { top: 1rem; left: 1rem; }
  .video-wrap { max-width: 320px; }
}
</style>
</head>
<body>

<a href="/" class="back-link">&larr; Volver al inicio</a>

<div class="container">
  <div>
    <div class="brand">MILES <span class="brand__accent">en vídeo</span></div>
    <div class="subtitle" style="margin-top: 0.4rem;">Barcelona Eixample · 30 segundos</div>
  </div>

  <div class="video-wrap">
    <video
      id="milesVideo"
      controls
      playsinline
      preload="metadata"
      poster="./assets/video/miles-ambiance-poster.jpg"
      autoplay
      muted
      loop>
      <source src="./assets/video/miles-ambiance.mp4" type="video/mp4">
      <source src="./assets/video/miles-ambiance-sd.mp4" type="video/mp4">
      Tu navegador no soporta este vídeo.
    </video>
    <button type="button" id="soundOverlay" class="sound-overlay" aria-label="Activar sonido">
      <span class="sound-overlay__pill">
        <svg class="sound-overlay__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M11 5 6 9H2v6h4l5 4V5z"/>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
        </svg>
        Activar sonido
      </span>
    </button>
  </div>

  <div class="cta-row">
    <a href="/reservar" class="btn btn--primary">Reservar</a>
    <a href="/eventos" class="btn btn--ghost">Privatizar la sala</a>
  </div>

  <div class="foot">
    Carrer de la Diputació 215 · Barcelona 08011 · Metro Universitat
  </div>
</div>

<script>
  (function () {
    var video = document.getElementById('milesVideo');
    var overlay = document.getElementById('soundOverlay');
    if (!video || !overlay) return;

    function enableSound() {
      video.muted = false;
      video.volume = 1;
      var p = video.play();
      if (p && typeof p.catch === 'function') { p.catch(function(){}); }
      overlay.classList.add('is-hidden');
      setTimeout(function () {
        if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
      }, 500);
    }

    overlay.addEventListener('click', enableSound);
    // Si l'utilisateur clique directement sur les contrôles natifs, on retire aussi l'overlay
    video.addEventListener('volumechange', function () {
      if (!video.muted) overlay.classList.add('is-hidden');
    });
  })();
</script>
  <script src="/miles-legal.js?v=1790352398" defer></script>
</body>
</html>
