<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>MILES · Anticipo</title>
<link rel="icon" href="/favicon.ico">
<link href="https://api.fontshare.com/v2/css?f[]=zodiak@400,600&f[]=general-sans@400,500,600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0C0A08;--card:#16120E;--line:rgba(232,224,208,.14);--gold:#D4A85A;--cream:#E8E0D0;--muted:#B5AC9C;--err:#F2A39B;--ok:#9BD5A4}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--cream);font-family:'General Sans','Helvetica Neue',sans-serif;font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{max-width:620px;margin:0 auto;padding:28px 18px 60px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:26px}
.top img{width:120px;height:auto;display:block}
.langs{display:flex;gap:4px}
.langs button{background:none;border:1px solid var(--line);color:var(--muted);border-radius:16px;min-height:34px;min-width:40px;font-size:13px;cursor:pointer}
.langs button.on{border-color:var(--gold);color:var(--gold)}
h1{font-family:'Zodiak',Georgia,serif;font-weight:600;font-size:30px;margin:0 0 6px;color:var(--cream)}
.sub{color:var(--muted);margin:0 0 22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:0 0 16px}
.card h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:0 0 12px;font-weight:600}
.row{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}
.row:last-child{border-bottom:0}
.row span:first-child{color:var(--muted)}
.row span:last-child{text-align:right;font-weight:500}
.big{font-size:19px;color:var(--gold)!important;font-weight:600!important}
.mono{font-family:ui-monospace,Menlo,monospace;letter-spacing:.02em;word-break:break-all}
.copy{background:none;border:1px solid var(--gold);color:var(--gold);border-radius:8px;min-height:34px;padding:0 10px;font-size:13px;margin-left:8px;cursor:pointer;white-space:nowrap}
p.note{font-size:14px;color:var(--muted);margin:10px 0 0}
.cond li{margin:0 0 8px;font-size:14.5px}
.cond{padding-left:18px;margin:0}
a{color:var(--gold)}
.chk{display:flex;gap:12px;align-items:flex-start;font-size:15px;margin:6px 0 16px;cursor:pointer}
.chk input{width:22px;height:22px;flex-shrink:0;margin-top:2px;accent-color:#D4A85A}
.met{display:flex;flex-direction:column;gap:8px;margin:0 0 14px}
.met label{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer}
.met input{width:20px;height:20px;accent-color:#D4A85A}
.btn{display:block;width:100%;min-height:52px;border-radius:12px;border:0;background:var(--gold);color:#1A140C;font-weight:600;font-size:16px;cursor:pointer}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.msg{border-radius:12px;padding:16px;font-size:15px;margin:0 0 16px;border:1px solid var(--line)}
.msg.ok{border-color:rgba(155,213,164,.4)}
.msg.err{border-color:rgba(242,163,155,.45);color:var(--err)}
.sec{font-size:13.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px;margin-top:22px}
.hide{display:none}
</style>
</head>

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let lang = (navigator.language || 'es').slice(0,2); if (!L[lang]) lang = 'es';
let D = null, state = { cancelled:false, err:null, done:null };
const root = document.getElementById('root');
const eur = n => Number(n).toLocaleString(L[lang].loc,{minimumFractionDigits:2,maximumFractionDigits:2}) + ' €';
const fD = ymd => new Date(ymd+'T12:00:00').toLocaleDateString(L[lang].loc,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const fDs = ymd => new Date(ymd+'T12:00:00').toLocaleDateString(L[lang].loc,{day:'numeric',month:'long',year:'numeric'});
const fDT = iso => new Date(iso).toLocaleString(L[lang].loc,{timeZone:'Europe/Madrid',weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'});
async function api(body){ try{ const r = await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...body,t})}); return await r.json(); }catch(e){ return {ok:false,error:'network'}; } }
function langs(){ document.getElementById('langs').innerHTML = ['es','en','fr','ca'].map(k=>`<button class="${k===lang?'on':''}" data-l="${k}" aria-label="${k.toUpperCase()}">${k.toUpperCase()}</button>`).join(''); document.querySelectorAll('#langs button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;document.documentElement.lang=lang;render();}); }
function msg(txt,cls){ root.innerHTML = `<h1>${L[lang].title}</h1><div class="msg ${cls||''}">${txt}</div><p class="sec">${L[lang].sec}</p>`; }
function render(){
  langs(); const x = L[lang];
  if (state.err) return msg(x[state.err] || x.generic, 'err');
  if (!D) return;
  if (state.cancelled) return msg(x.cancelled, 'err');
  const met = D.metodo, showBank = met !== 'efectivo', showCash = met !== 'transferencia';
  const plazo = (D.plazo_tipo==='horas'||D.plazo_tipo==='fecha') ? (D.plazo_at ? x.until(fDT(D.plazo_at)) : '') : D.plazo_tipo==='antes_llegada' ? x.before : (D.plazo_texto||'');
  const row = (k,v,c='') => `<div class="row"><span>${k}</span><span class="${c}">${v}</span></div>`;
  const first = esc((D.nombre||'').split(' ')[0]);
  let status = '';
  if (D.estado_pago==='verificado') status = `<div class="msg ok">${x.verified}</div>`;
  else if (state.done) status = `<div class="msg ok">${state.done==='efectivo'?x.doneC:x.doneT}</div>`;
  else if (D.estado_pago==='declarado') status = `<div class="msg ok">${x.declared(fDT(D.declared_at))}</div>`;
  const canDeclare = D.estado_pago==='pendiente' && !state.done;
  root.innerHTML = `
  <h1>${x.title}</h1><p class="sub">${x.hi(first)}</p>
  ${status}
  <div class="card"><h2>${x.sum}</h2>
    ${row(x.ref, esc(D.ref), 'mono')}
    ${row(x.date, esc(fD(D.fecha)) + (D.hora ? ' · ' + esc(String(D.hora).slice(0,5)) : ''))}
    ${row(x.pers, esc(D.personas))}
    ${row(x.formula, esc(x.f[D.formula]||'') + (D.precio_persona ? ' · ' + eur(D.precio_persona) + '/pers.' : ''))}
    ${row(x.total, eur(D.total))}
    ${row(x.dep, eur(D.importe) + ' (' + Number(D.pct).toLocaleString(x.loc,{maximumFractionDigits:2}) + ' %)', 'big')}
    ${D.importe_recibido != null ? row(x.rec, eur(D.importe_recibido)) : ''}
    ${row(x.saldo, eur(D.saldo))}
    ${row(x.met, esc(x.m[met]))}
    ${plazo ? row(x.plazo, esc(plazo)) : ''}
    ${D.saldo_texto ? `<p class="note">${esc(D.saldo_texto)}</p>` : ''}
  </div>
  ${showBank && D.bank ? `<div class="card"><h2>${x.bank}</h2>
    ${row(x.tit, esc(D.bank.titular))}
    <div class="row"><span>${x.iban}</span><span><span class="mono" id="iban">${esc(D.bank.iban.replace(/(.{4})/g,'$1 ').trim())}</span><button class="copy" data-c="${esc(D.bank.iban)}">${x.copy}</button></span></div>
    ${D.bank.banco ? row(x.banco, esc(D.bank.banco)) : ''}${D.bank.bic ? row(x.bic, esc(D.bank.bic), 'mono') : ''}
    ${row(x.amount, eur(D.importe), 'big')}
    <div class="row"><span>${x.refT}</span><span><span class="mono">${esc(D.referencia)}</span><button class="copy" data-c="${esc(D.referencia)}">${x.copy}</button></span></div>
    <p class="note">${x.refNote}</p></div>` : ''}
  ${showCash ? `<div class="card"><h2>${x.cash}</h2><p style="margin:0;font-size:15px">${x.cashTxt}</p></div>` : ''}
  <div class="card"><h2>${x.cond}</h2><ul class="cond">
    <li>${met==='efectivo'?x.cConfCash:x.cConf}</li>
    <li>${x.cGar}</li>
    <li>${D.reduccion_modo === 'fecha' && D.reduccion_limite ? x.cRed(esc(fDs(D.reduccion_limite)), D.reduccion_min) : x.cNoRed(esc(D.personas))}</li>
    <li>${x.cInc}</li>
    ${D.cancel_limite ? `<li>${x.cCan(esc(fDs(D.cancel_limite)), esc(D.cancel_dias))}</li>` : ''}
    <li>${x.cEmp}</li></ul>
    <p class="note">${x.links(x.c, x.p)}</p></div>
  ${canDeclare ? `<div class="card">
    ${met==='a_elegir' ? `<h2>${x.choose}</h2><div class="met"><label><input type="radio" name="met" value="transferencia"> ${x.m.transferencia}</label><label><input type="radio" name="met" value="efectivo"> ${x.m.efectivo}</label></div>` : ''}
    <label class="chk"><input type="checkbox" id="acc"> <span>${x.accept}</span></label>
    <div id="err" class="msg err hide"></div>
    <button class="btn" id="go" disabled>${x.btn}</button></div>` : ''}
  <div class="card"><h2>${({es:'Factura',en:'Invoice',fr:'Facture',ca:'Factura'})[lang]}</h2><p style="margin:0 0 12px;font-size:15px">${({es:'¿Necesitas una factura a nombre de tu empresa? Indícanos tus datos fiscales.',en:'Need an invoice in your company’s name? Send us your billing details.',fr:'Besoin d’une facture au nom de votre entreprise ? Indiquez-nous vos informations fiscales.',ca:'Necessites una factura a nom de la teva empresa? Indica’ns les teves dades fiscals.'})[lang]}</p><a class="copy" style="display:inline-flex;align-items:center;text-decoration:none;margin:0;min-height:42px;padding:0 14px" href="/factura?t=${encodeURIComponent(t)}&lang=${lang}">${({es:'Pedir factura',en:'Request an invoice',fr:'Demander une facture',ca:'Demanar factura'})[lang]} →</a></div>
  <p class="sec">${x.sec}<br>NECTARINE, S.L. · CIF B66103920</p>`;
  document.querySelectorAll('.copy').forEach(b => b.onclick = () => navigator.clipboard.writeText(b.dataset.c).then(() => { b.textContent = x.copied; setTimeout(() => b.textContent = x.copy, 1800); }));
  const acc = document.getElementById('acc'), go = document.getElementById('go'), er = document.getElementById('err');
  if (acc) { acc.onchange = () => { go.disabled = !acc.checked; }; go.onclick = async () => {
    er.classList.add('hide');
    if (!acc.checked) { er.textContent = x.errAccept; er.classList.remove('hide'); return; }
    let m = D.metodo; if (m==='a_elegir') { const s = document.querySelector('input[name=met]:checked'); if (!s) { er.textContent = x.errMet; er.classList.remove('hide'); return; } m = s.value; }
    go.disabled = true;
    const r = await api({action:'declare', accept:true, metodo:m, lang});
    if (r && r.ok) { state.done = r.already === 'verificado' ? null : (r.metodo || m); if (r.already==='verificado') D.estado_pago='verificado'; render(); window.scrollTo({top:0,behavior:'smooth'}); return; }
    if (r && r.error === 'cancelled') { state.cancelled = true; return render(); }
    er.textContent = (r && x[r.error]) || x.generic; er.classList.remove('hide'); go.disabled = false;
  }; }
}
(async () => {
  if (!/^[A-Za-z0-9_-]{40,60}$/.test(t)) { state.err = 'invalid'; return render(); }
  const r = await api({action:'get'});
  if (!r || !r.ok) { state.err = r && (r.error==='expired' ? 'expired' : r.error==='invalid_link' ? 'invalid' : 'generic') || 'generic'; return render(); }
  D = r.data; state.cancelled = !!r.cancelled; if (L[D.idioma]) lang = D.idioma; document.documentElement.lang = lang; render();
})();
})();
</script>
