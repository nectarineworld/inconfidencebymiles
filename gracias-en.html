<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0C0A08" />
<title>Request received · MILES</title>
<link rel="stylesheet" href="/reservar.css" />
</head>
<body>
<div class="topbar">
  <div class="topbar__brand"><video class="miles-logo-video" muted playsinline preload="auto" poster="assets/logo/logo-3d-static.png" width="60" height="28" aria-label="MILES"><source src="assets/logo/logo-3d.webm" type="video/webm"><source src="assets/logo/logo-3d.mp4" type="video/mp4"><img src="assets/logo/logo-3d-static.png" alt="MILES"></video></div>
</div>

<div class="wrap">
  <div class="confirm-card">
    <div class="confirm-card__check">✓</div>
    <h2>Thank you!</h2>
    <p>We have received your request.<br>We will get back to you quickly.</p>
    <p class="small-muted" id="recap"></p>

    <div class="note">
      <b>Please note:</b> your request is not yet a confirmed booking. You will receive our proposal before the date is held.
    </div>

    <div style="height:20px"></div>

    <a class="btn btn--wa" id="wa-btn" href="#" target="_blank" rel="noopener">
      💬 Continue on WhatsApp (optional)
    </a>

    <div style="height:10px"></div>

    <a class="btn btn--ghost" href="/en">Back to home</a>
  </div>
</div>

<script>
  const p = new URLSearchParams(location.search);
  const TYPES_LBL = {
    'table':'Table',
    'grupo':'Group/event',
    'priv-ic':'Private hire Sala In Confidence',
    'priv-salvaje':'Private hire Sala Salvaje',
    'priv-total':'Private hire all of MILES'
  };
  const lines = [];
  if (p.get('type')) lines.push('Type: ' + (TYPES_LBL[p.get('type')] || p.get('type')));
  if (p.get('date')) lines.push('Date: ' + p.get('date'));
  if (p.get('time')) lines.push('Time: ' + p.get('time'));
  if (p.get('pers')) lines.push('Guests: ' + p.get('pers'));
  if (p.get('nombre')) lines.push('Name: ' + p.get('nombre'));
  document.getElementById('recap').innerHTML = lines.map(l => '· ' + l).join('<br>');

  const wa = 'Hello MILES, I have just sent a request from the website:%0A%0A' +
    lines.map(l => l.replace('· ','')).join('%0A');
  document.getElementById('wa-btn').href = 'https://wa.me/34932472654?text=' + wa;
</script>
<script src="miles-logo-video.js"></script>
<script src="miles-legal.js?v=1790352398"></script>
</body>
</html>
