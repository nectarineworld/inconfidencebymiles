<body>
<div class="topbar">
  <div class="topbar__brand"><video class="miles-logo-video" muted playsinline preload="auto" poster="assets/logo/logo-3d-static.png" width="60" height="28" aria-label="MILES"><source src="assets/logo/logo-3d.webm" type="video/webm"><source src="assets/logo/logo-3d.mp4" type="video/mp4"><img src="assets/logo/logo-3d-static.png" alt="MILES"></video></div>
</div>

<div class="wrap">
  <div class="confirm-card">
    <div class="confirm-card__check">✓</div>
    <h2>Merci !</h2>
    <p>Nous avons bien reçu votre demande.<br>Nous vous répondrons rapidement.</p>
    <p class="small-muted" id="recap"></p>

    <div class="note">
      <b>À noter :</b> votre demande n’est pas encore une réservation confirmée. Vous recevrez notre proposition avant que la date soit bloquée.
    </div>

    <div style="height:20px"></div>

    <a class="btn btn--wa" id="wa-btn" href="#" target="_blank" rel="noopener">
      💬 Continuer sur WhatsApp (facultatif)
    </a>

    <div style="height:10px"></div>

    <a class="btn btn--ghost" href="/fr">Retour à l’accueil</a>
  </div>
</div>

<script>
  const p = new URLSearchParams(location.search);
  const TYPES_LBL = {
    'table':'Table',
    'grupo':'Groupe/événement',
    'priv-ic':'Privatisation Sala In Confidence',
    'priv-salvaje':'Privatisation Sala Salvaje',
    'priv-total':'Privatisation de tout MILES'
  };
  const lines = [];
  if (p.get('type')) lines.push('Type : ' + (TYPES_LBL[p.get('type')] || p.get('type')));
  if (p.get('date')) lines.push('Date : ' + p.get('date'));
  if (p.get('time')) lines.push('Heure : ' + p.get('time'));
  if (p.get('pers')) lines.push('Personnes : ' + p.get('pers'));
  if (p.get('nombre')) lines.push('Nom : ' + p.get('nombre'));
  document.getElementById('recap').innerHTML = lines.map(l => '· ' + l).join('<br>');

  const wa = 'Bonjour MILES, je viens d’envoyer une demande depuis le site :%0A%0A' +
    lines.map(l => l.replace('· ','')).join('%0A');
  document.getElementById('wa-btn').href = 'https://wa.me/34932472654?text=' + wa;
</script>
