<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#141210" />
<title>Planning · Espacio MILES</title>
<link rel="stylesheet" href="style.css?v=1790352398" />
<link rel="stylesheet" href="admin.css?v=1790372772" />
</head>
<body>

<div class="wrap" style="padding-bottom:110px">

  <!-- Header mois avec navigation -->
  <div class="mp-head">
    <div class="mp-head__month" id="mp-month-label">—</div>
    <div class="mp-head__nav">
      <button id="mp-prev" aria-label="Mes anterior">‹</button>
      <button id="mp-today" style="min-width:auto; padding:0 14px; font-size:12px; letter-spacing:0.1em; text-transform:uppercase">Hoy</button>
      <button id="mp-next" aria-label="Mes siguiente">›</button>
    </div>
  </div>

  <!-- Ligne des jours de la semaine -->
  <div class="mp-dow">
    <div>Lun</div><div>Mar</div><div>Mié</div><div>Jue</div><div>Vie</div><div>Sáb</div><div>Dom</div>
  </div>

  <!-- Grille calendrier -->
  <div class="mp-grid" id="mp-grid"></div>

  <!-- Legende -->
  <div class="mp-legend">
    <span class="mp-legend__item"><span class="mp-dot mp-dot--new"></span> Nueva</span>
    <span class="mp-legend__item"><span class="mp-dot mp-dot--contact"></span> A contactar</span>
    <span class="mp-legend__item"><span class="mp-dot mp-dot--discuss"></span> En conversación</span>
    <span class="mp-legend__item"><span class="mp-dot mp-dot--option"></span> Opción</span>
    <span class="mp-legend__item"><span class="mp-dot mp-dot--confirmed"></span> Confirmada</span>
    <span class="mp-legend__item"><span class="mp-dot" style="background:rgba(239,68,68,0.6)"></span> Todo MILES bloqueado</span>
    <span class="mp-legend__item"><span class="mp-pip mp-pip--ic"></span> Sala In Confidence bloqueada</span>
    <span class="mp-legend__item"><span class="mp-pip mp-pip--sv"></span> Sala Salvaje bloqueada</span>
  </div>
</div>

<!-- Bottom sheet du jour sélectionné -->
<div class="mp-sheet-back" id="mp-sheet-back"></div>
<div class="mp-sheet" id="mp-sheet" role="dialog" aria-hidden="true">
  <div class="mp-sheet__grip"></div>
  <div class="mp-sheet__head">
    <div class="mp-sheet__date" id="mp-sheet-date">—</div>
    <button class="mp-sheet__close" id="mp-sheet-close" aria-label="Cerrar">✕</button>
  </div>
  <div class="mp-sheet-items" id="mp-sheet-items"></div>
  <div id="mp-block-controls" style="margin:6px 0 10px"></div>
  <div class="action-stack">
    <button id="mp-add-btn" class="btn btn--ghost" type="button">+ Añadir reserva manual</button>
  </div>
</div>

<!-- Modal: Añadir reserva manual (admin) -->
<div id="manual-modal" style="display:none;position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.6);align-items:center;justify-content:center;padding:16px">
  <div style="background:#FFFFFF;border-radius:14px;max-width:460px;width:100%;padding:22px;color:#1F1B16;box-shadow:0 20px 60px rgba(0,0,0,.5);max-height:90vh;overflow-y:auto">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <h3 style="margin:0;font-family:'General Sans',sans-serif;font-size:16px;letter-spacing:.14em;text-transform:uppercase;color:#8C6A2C">Añadir reserva</h3>
      <button type="button" id="manual-close" style="background:none;border:none;color:#5A5348;font-size:22px;cursor:pointer;padding:4px 8px">✕</button>
    </div>
    <p id="manual-date-label" style="margin:0 0 14px;font-size:13px;color:#5A5348"></p>
    <form id="manual-form" style="display:flex;flex-direction:column;gap:12px">
      <label style="display:flex;flex-direction:column;gap:4px;font-size:12px;color:#5A5348">
        Nombre*
        <input required name="nombre" type="text" maxlength="120" style="padding:10px 12px;background:#FFFFFF;border:1px solid #D8D0C2;border-radius:8px;color:#1F1B16;font-size:14px">
      </label>
      <div style="display:flex;gap:10px">
        <label style="flex:1;display:flex;flex-direction:column;gap:4px;font-size:12px;color:#5A5348">
          Teléfono
          <input name="telefono" type="tel" maxlength="30" style="padding:10px 12px;background:#FFFFFF;border:1px solid #D8D0C2;border-radius:8px;color:#1F1B16;font-size:14px">
        </label>
        <label style="width:110px;display:flex;flex-direction:column;gap:4px;font-size:12px;color:#5A5348">
          Personas*
          <input required name="num_personas" type="number" min="1" max="200" value="2" style="padding:10px 12px;background:#FFFFFF;border:1px solid #D8D0C2;border-radius:8px;color:#1F1B16;font-size:14px">
        </label>
      </div>
      <div style="display:flex;gap:10px">
        <label style="flex:1;display:flex;flex-direction:column;gap:4px;font-size:12px;color:#5A5348">
          Hora
          <input name="hora" type="time" style="padding:10px 12px;background:#FFFFFF;border:1px solid #D8D0C2;border-radius:8px;color:#1F1B16;font-size:14px">
        </label>
        <label style="flex:1;display:flex;flex-direction:column;gap:4px;font-size:12px;color:#5A5348">
          Tipo*
          <select required name="tipo" style="padding:10px 12px;background:#FFFFFF;border:1px solid #D8D0C2;border-radius:8px;color:#1F1B16;font-size:14px">
            <option value="mesa">Mesa (1-10)</option>
            <option value="grupo">Grupo (10-20)</option>
            <option value="privatizacion_ic">Priv. In Confidence</option>
            <option value="privatizacion_salvaje">Priv. Salvaje</option>
            <option value="privatizacion_total">Priv. Total MILES</option>
          </select>
        </label>
      </div>
      <label style="display:flex;flex-direction:column;gap:4px;font-size:12px;color:#5A5348">
        Email (opcional)
        <input type="email" name="email" style="padding:10px 12px;background:#FFFFFF;border:1px solid #D8D0C2;border-radius:8px;color:#1F1B16;font-size:14px">
      </label>
      <label style="display:flex;flex-direction:column;gap:4px;font-size:12px;color:#5A5348">
        Notas (opcional)
        <textarea name="mensaje" rows="2" maxlength="500" style="padding:10px 12px;background:#FFFFFF;border:1px solid #D8D0C2;border-radius:8px;color:#1F1B16;font-size:14px;font-family:inherit;resize:vertical"></textarea>
      </label>
      <div id="manual-error" style="display:none;font-size:12px;color:#e07070;padding:8px 12px;background:rgba(224,112,112,.1);border-radius:8px"></div>
      <button type="submit" id="manual-submit" style="margin-top:6px;padding:12px;background:#1F1B16;color:#FFFFFF;border:none;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer">Guardar reserva</button>
    </form>
  </div>
</div>

<div id="tabbar-root"></div>

<script src="miles-data.js?v=1790372772"></script>
<script>
  milesMountNav('plan');
(async () => {
  await window.milesDataReady;

  const MONTHS_ES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

  // Index des demandes par date ISO (rebuild-able)
  let byDate = {};
  function rebuildByDate() {
    byDate = {};
    (window.DEMANDS || []).forEach(d => {
      (byDate[d.date] = byDate[d.date] || []).push(d);
    });
    Object.values(byDate).forEach(arr => arr.sort((a,b) => a.time.localeCompare(b.time)));
  }
  rebuildByDate();

  // État
  const today = new Date();
  today.setHours(0,0,0,0);
  let viewYear = today.getFullYear();
  let viewMonth = today.getMonth(); // 0-based

  function isoOf(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }

  function statusesOfDay(iso) {
    const arr = byDate[iso] || [];
    const set = new Set(arr.map(x => x.status));
    return { count: arr.length, statuses: set };
  }

  function renderMonth() {
    // Label
    document.getElementById('mp-month-label').textContent =
      `${MONTHS_ES[viewMonth]} ${viewYear}`;

    const first = new Date(viewYear, viewMonth, 1);
    const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();

    // Décalage : lundi = 0 (getDay: 0=dim, 1=lun, ..., 6=sam) → on veut lun-first
    let firstDow = first.getDay();
    firstDow = (firstDow + 6) % 7; // 0 = lundi

    const grid = document.getElementById('mp-grid');
    grid.innerHTML = '';

    // Jours du mois précédent (pour remplir la première ligne)
    const prevMonthDays = new Date(viewYear, viewMonth, 0).getDate();
    for (let i = firstDow - 1; i >= 0; i--) {
      const cell = document.createElement('div');
      cell.className = 'mp-cell mp-cell--other';
      cell.innerHTML = `<div class="mp-cell__num">${prevMonthDays - i}</div>`;
      grid.appendChild(cell);
    }

    // Jours du mois courant
    for (let day = 1; day <= daysInMonth; day++) {
      const d = new Date(viewYear, viewMonth, day);
      const iso = isoOf(d);
      const isPast = d < today;
      const isToday = d.getTime() === today.getTime();
      const isBlocked = MANUAL_BLOCKS.has(iso);
      const { count, statuses } = statusesOfDay(iso);

      const cell = document.createElement('div');
      cell.className = 'mp-cell';
      if (isPast && !isToday) cell.classList.add('mp-cell--past');
      if (isToday) cell.classList.add('mp-cell--today');
      if (isBlocked) cell.classList.add('mp-cell--blocked');
      const rs = (window.ROOM_BLOCKS && window.ROOM_BLOCKS.get(iso)) || new Set();
      const roomPips = (!isBlocked ? (rs.has('ic') ? '<span class="mp-pip mp-pip--ic" title="Sala In Confidence bloqueada"></span>' : '') + (rs.has('salvaje') ? '<span class="mp-pip mp-pip--sv" title="Sala Salvaje bloqueada"></span>' : '') : '');

      // Pastilles (max 4 pour rester lisible)
      let dots = '';
      const order = ['confirmed','option','discuss','contact','new'];
      let dotCount = 0;
      for (const s of order) {
        if (statuses.has(s) && dotCount < 4) {
          dots += `<span class="mp-dot mp-dot--${s}"></span>`;
          dotCount++;
        }
      }

      cell.innerHTML = `
        <div class="mp-cell__num">${day}</div>
        <div class="mp-cell__dots">${dots}</div>
        ${count > 1 ? `<span class="mp-cell__count">${count}</span>` : ''}
        ${roomPips ? `<span class="mp-rooms">${roomPips}</span>` : ''}
      `;

      cell.addEventListener('click', () => openSheet(iso, d));
      grid.appendChild(cell);
    }

    // Jours suivants pour compléter la grille (multiple de 7)
    const totalCells = firstDow + daysInMonth;
    const trailing = (7 - (totalCells % 7)) % 7;
    for (let i = 1; i <= trailing; i++) {
      const cell = document.createElement('div');
      cell.className = 'mp-cell mp-cell--other';
      cell.innerHTML = `<div class="mp-cell__num">${i}</div>`;
      grid.appendChild(cell);
    }
  }

  // Bottom sheet
  const sheet = document.getElementById('mp-sheet');
  const sheetBack = document.getElementById('mp-sheet-back');
  const sheetItems = document.getElementById('mp-sheet-items');
  const sheetDate = document.getElementById('mp-sheet-date');
  const addBtn = document.getElementById('mp-add-btn');

  function openSheet(iso, d) {
    const list = byDate[iso] || [];
    const isBlocked = MANUAL_BLOCKS.has(iso);

    sheetDate.textContent = d.toLocaleDateString('es-ES', {
      weekday:'long', day:'numeric', month:'long'
    });

    if (list.length === 0) {
      sheetItems.innerHTML = `
        <p class="small-muted" style="text-align:center; padding:24px 0">
          ${isBlocked ? 'Todo MILES bloqueado: no se puede elegir en el formulario público.' : 'Sin solicitudes este día.'}
        </p>`;
    } else {
      sheetItems.innerHTML = list.map(x => `
        <a class="mp-sheet-item" href="miles-fiche.html?id=${x.id}">
          <div class="mp-sheet-item__time">${x.time || ''}</div>
          <div class="mp-sheet-item__body">
            <b>${x.nombre} · ${x.personas} pers.</b>
            <small>${TYPE_LABELS[x.type]||x.type} · recibida ${x.createdAt}</small>
          </div>
          <span class="badge ${STATUS_CLASS[x.status]}">${STATUS_LABELS[x.status]}</span>
        </a>
      `).join('');
    }

    window.milesBlockControls(document.getElementById('mp-block-controls'), iso, () => renderMonth());

    addBtn.onclick = (e) => { e.preventDefault(); openManualModal(iso, d); };

    sheet.classList.add('mp-sheet--open');
    sheetBack.classList.add('mp-sheet-back--open');
    sheet.setAttribute('aria-hidden','false');
  }

  function closeSheet() {
    sheet.classList.remove('mp-sheet--open');
    sheetBack.classList.remove('mp-sheet-back--open');
    sheet.setAttribute('aria-hidden','true');
  }
  document.getElementById('mp-sheet-close').onclick = closeSheet;
  sheetBack.onclick = closeSheet;

  // Nav mois
  document.getElementById('mp-prev').onclick = () => {
    viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; }
    renderMonth();
  };
  document.getElementById('mp-next').onclick = () => {
    viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; }
    renderMonth();
  };
  document.getElementById('mp-today').onclick = () => {
    viewYear = today.getFullYear();
    viewMonth = today.getMonth();
    renderMonth();
  };

  // === Modal réserva manual ===
  const manualModal = document.getElementById('manual-modal');
  const manualForm = document.getElementById('manual-form');
  const manualDateLabel = document.getElementById('manual-date-label');
  const manualError = document.getElementById('manual-error');
  const manualSubmit = document.getElementById('manual-submit');
  let manualCurrentIso = null;

  window.openManualModal = function(iso, d) {
    manualCurrentIso = iso;
    const fmt = new Intl.DateTimeFormat('es-ES', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    manualDateLabel.textContent = 'Fecha: ' + fmt.format(d);
    manualForm.reset();
    manualError.style.display = 'none';
    manualModal.style.display = 'flex';
  };
  document.getElementById('manual-close').onclick = () => { manualModal.style.display = 'none'; };
  manualModal.onclick = (e) => { if (e.target === manualModal) manualModal.style.display = 'none'; };

  manualForm.onsubmit = async (e) => {
    e.preventDefault();
    manualError.style.display = 'none';
    manualSubmit.disabled = true;
    manualSubmit.textContent = 'Guardando...';
    const fd = new FormData(manualForm);
    const params = {
      nombre: fd.get('nombre'),
      telefono: fd.get('telefono') || null,
      email: fd.get('email') || null,
      num_personas: parseInt(fd.get('num_personas'), 10),
      fecha: manualCurrentIso,
      hora: fd.get('hora') || null,
      tipo: fd.get('tipo'),
      mensaje: fd.get('mensaje') || null
    };
    try {
      const token = window.milesGetToken();
      const res = await fetch('https://fmikzxqquazduyhyvxfz.supabase.co/functions/v1/admin-api', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Admin-Token': token || '' },
        body: JSON.stringify({ action: 'create_manual_demand', params })
      });
      const j = await res.json();
      if (!j.ok) throw new Error(j.error || 'error');
      manualModal.style.display = 'none';
      await window.milesReloadData();
      rebuildByDate();
      renderMonth();
      openSheet(manualCurrentIso, new Date(manualCurrentIso + 'T00:00:00'));
    } catch (err) {
      manualError.textContent = 'Error: ' + err.message;
      manualError.style.display = 'block';
    } finally {
      manualSubmit.disabled = false;
      manualSubmit.textContent = 'Guardar reserva';
    }
  };

  renderMonth();
})();
</script>
</body>
</html>
