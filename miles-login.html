<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0C0A08" />
<title>Admin · MILES</title>
<link rel="stylesheet" href="style.css?v=1790352398" />
<link rel="stylesheet" href="admin.css?v=1790352398" />
<script>document.documentElement.classList.add("adm")</script>
<style>
  .login-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .login-card {
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 40px 30px;
    max-width: 400px;
    width: 100%;
    text-align: center;
  }
  .login-logo {
    margin-bottom: 24px;
  }
  .login-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
    background: rgba(255,255,255,0.04);
    border-radius: 12px;
    padding: 4px;
  }
  .login-tab {
    flex: 1;
    padding: 10px;
    background: transparent;
    border: 0;
    color: var(--color-text-faint);
    cursor: pointer;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
  }
  .login-tab--active {
    background: var(--color-gold);
    color: #0C0A08;
  }
  .login-form { display: none; text-align: left; }
  .login-form--active { display: block; }
  .login-form label { display: block; margin-bottom: 6px; font-size: 13px; color: var(--color-text-faint); }
  .login-form input {
    width: 100%;
    padding: 12px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    color: var(--color-cream);
    font-size: 15px;
    font-family: inherit;
    margin-bottom: 16px;
    box-sizing: border-box;
  }
  .login-error {
    color: #ff6b6b;
    font-size: 13px;
    margin-top: 12px;
    text-align: center;
    min-height: 18px;
  }
  .login-info {
    color: var(--color-text-faint);
    font-size: 12px;
    text-align: center;
    margin-top: 20px;
    line-height: 1.5;
  }
  .biometric-btn {
    background: var(--color-gold);
    color: #0C0A08;
    border: 0;
    border-radius: 12px;
    padding: 16px;
    font-size: 16px;
    font-weight: 600;
    width: 100%;
    cursor: pointer;
    font-family: inherit;
    margin-bottom: 12px;
  }
  .biometric-btn:disabled { opacity: 0.5; cursor: default; }
  .biometric-icon { font-size: 24px; }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <h1 class="login-title">MILES</h1>
      <p style="color:var(--color-text-faint); font-size:13px; margin-top:8px">Panel de administración</p>
    </div>

    <div class="login-tabs">
      <button class="login-tab login-tab--active" data-form="biometric">🖐 Huella</button>
      <button class="login-tab" data-form="password">🔑 Contraseña</button>
    </div>

    <!-- Biometric -->
    <div id="form-biometric" class="login-form login-form--active">
      <button class="biometric-btn" id="btn-webauthn">
        <span class="biometric-icon">🖐</span><br>
        Entrar con huella / Face ID
      </button>
      <p class="login-info">
        Solo funciona en dispositivos donde has registrado tu huella.<br>
        Si es tu primera vez, entra con contraseña.
      </p>
      <div class="login-error" id="err-webauthn"></div>
    </div>

    <!-- Password -->
    <div id="form-password" class="login-form">
      <label>Contraseña de administración</label>
      <input type="password" id="pw" autocomplete="current-password" />
      <button class="biometric-btn" id="btn-pw">Entrar</button>
      <div class="login-error" id="err-pw"></div>
    </div>

    <p class="login-info">
      Sesión guardada en este dispositivo durante 60 días (se renueva con cada uso). «Salir» la cierra.<br>NECTARINE, S.L. · Acceso restringido al titular.
    </p>
  </div>
</div>

<script>
const ADMIN_API = 'https://fmikzxqquazduyhyvxfz.supabase.co/functions/v1/admin-api';

// Session persistante : si un token valide existe, on entre directement
const LS = window.localStorage;
try { const o = sessionStorage.getItem('miles_admin_token'); if (o && !LS.getItem('miles_admin_token')) LS.setItem('miles_admin_token', o); sessionStorage.removeItem('miles_admin_token'); } catch(e){}
function goIn() {
  let dest = 'miles-planning.html';
  try { const r = sessionStorage.getItem('miles_return'); if (r && /^\/miles-(planning|demandes|fiche|bloquear)\.html/.test(r)) dest = r.slice(1); sessionStorage.removeItem('miles_return'); } catch(e){}
  location.replace(dest);
}
function saveToken(t) { LS.setItem('miles_admin_token', t); }
const loggedOut = new URLSearchParams(location.search).has('out');
(async () => {
  const t = LS.getItem('miles_admin_token');
  if (t) {
    const r = await api('check_session', {}, t).catch(() => null);
    if (r && r.ok) return goIn();
    LS.removeItem('miles_admin_token');
  }
  // Appareil déjà enregistré : on lance l'empreinte directement (1 geste)
  if (LS.getItem('miles_passkey_id') && !loggedOut && window.PublicKeyCredential) {
    setTimeout(() => document.getElementById('btn-webauthn').click(), 0);
  }
})();

async function api(action, params, token) {
  const headers = { 'Content-Type': 'application/json' };
  if (token) headers['X-Admin-Token'] = token;
  const r = await fetch(ADMIN_API, {
    method: 'POST', headers,
    body: JSON.stringify({ action, params: params ?? {} })
  });
  return await r.json();
}

// Tabs
document.querySelectorAll('.login-tab').forEach(t => {
  t.onclick = () => {
    document.querySelectorAll('.login-tab').forEach(x => x.classList.remove('login-tab--active'));
    t.classList.add('login-tab--active');
    document.querySelectorAll('.login-form').forEach(f => f.classList.remove('login-form--active'));
    document.getElementById('form-' + t.dataset.form).classList.add('login-form--active');
  };
});

// Password login
document.getElementById('btn-pw').onclick = async () => {
  const pw = document.getElementById('pw').value;
  const err = document.getElementById('err-pw');
  if (!pw) { err.textContent = 'Introduce la contraseña'; return; }
  err.textContent = 'Verificando…';
  const r = await api('login_password', { password: pw });
  if (r && r.ok && r.token) {
    saveToken(r.token);
    // Proponer enregistrer passkey si supporte
    if (window.PublicKeyCredential && !LS.getItem('miles_passkey_id')) {
      const wantPasskey = confirm('¿Quieres registrar este dispositivo (huella / Face ID) para conectarte sin contraseña la próxima vez?');
      if (wantPasskey) {
        try {
          await registerPasskey(r.token);
          alert('Dispositivo registrado. La próxima vez podrás entrar con huella.');
        } catch (e) {
          console.warn('Passkey registration cancelled or failed:', e);
        }
      }
    }
    goIn();
  } else {
    err.textContent = 'Contraseña incorrecta';
  }
};
document.getElementById('pw').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('btn-pw').click();
});

// WebAuthn login
document.getElementById('btn-webauthn').onclick = async () => {
  const err = document.getElementById('err-webauthn');
  if (!window.PublicKeyCredential) {
    err.textContent = 'Tu navegador no soporta WebAuthn';
    return;
  }
  err.textContent = 'Preparando…';
  const pid = LS.getItem('miles_passkey_id');
  const opts = await api('webauthn_login_options', pid ? { preferIds: [pid] } : {});
  if (!opts || !opts.ok) {
    if (opts && opts.error === 'no_credentials_registered') {
      err.textContent = 'Ningún dispositivo registrado. Entra con contraseña primero.';
    } else {
      err.textContent = 'Error: ' + (opts?.error || 'desconocido');
    }
    return;
  }
  try {
    const pk = opts.publicKey;
    const cred = await navigator.credentials.get({
      publicKey: {
        challenge: b64urlToBuf(pk.challenge),
        rpId: pk.rpId,
        allowCredentials: pk.allowCredentials.map(c => ({
          type: 'public-key',
          id: b64urlToBuf(c.id)
        })),
        userVerification: pk.userVerification,
        timeout: pk.timeout
      }
    });
    if (!cred) { err.textContent = 'Cancelado'; return; }
    const credentialId = bufToB64url(cred.rawId);
    err.textContent = 'Verificando…';
    const verify = await api('webauthn_login_verify', {
      credentialId,
      challenge: pk.challenge,
      authenticatorData: bufToB64url(cred.response.authenticatorData),
      clientDataJSON: bufToB64url(cred.response.clientDataJSON),
      signature: bufToB64url(cred.response.signature)
    });
    if (verify && verify.ok && verify.token) {
      saveToken(verify.token);
      LS.setItem('miles_passkey_id', credentialId);
      goIn();
    } else {
      err.textContent = verify?.error === 'unknown_credential' || verify?.error === 'bad_signature' ? 'Esta huella ya no es válida en este dispositivo. Entra con la contraseña y vuelve a registrarla.' : 'Error: ' + (verify?.error || 'desconocido');
      if (verify?.error === 'unknown_credential') LS.removeItem('miles_passkey_id');
    }
  } catch (e) {
    err.textContent = (e && e.name === 'NotAllowedError') ? 'Toca el botón para usar tu huella.' : 'Error: ' + (e?.message || e);
  }
};

async function registerPasskey(sessionToken) {
  const opts = await api('webauthn_registration_options', {}, sessionToken);
  if (!opts || !opts.ok) throw new Error(opts?.error || 'options failed');
  const pk = opts.publicKey;
  const cred = await navigator.credentials.create({
    publicKey: {
      challenge: b64urlToBuf(pk.challenge),
      rp: pk.rp,
      user: {
        id: b64urlToBuf(pk.user.id),
        name: pk.user.name,
        displayName: pk.user.displayName
      },
      pubKeyCredParams: pk.pubKeyCredParams,
      authenticatorSelection: pk.authenticatorSelection,
      timeout: pk.timeout,
      attestation: pk.attestation
    }
  });
  if (!cred) throw new Error('cancelled');
  const credentialId = bufToB64url(cred.rawId);
  // Extraire public key du attestationObject (simplifie : on stocke le rawId + tag)
  // Pour une v1, on stocke juste le credentialId. Le champ public_key n'est pas verifie cote serveur.
  const pubKey = bufToB64url(cred.response.getPublicKey ? cred.response.getPublicKey() : cred.rawId);
  const deviceName = navigator.userAgent.includes('iPhone') ? 'iPhone' :
                     navigator.userAgent.includes('Mac') ? 'Mac' :
                     navigator.userAgent.includes('Android') ? 'Android' : 'Navegador';
  const r = await api('webauthn_register_verify', {
    credentialId, publicKey: pubKey, deviceName, challenge: pk.challenge
  }, sessionToken);
  if (!r || !r.ok) throw new Error(r?.error || 'register failed');
  LS.setItem('miles_passkey_id', credentialId);
}

// Base64url helpers
function b64urlToBuf(s) {
  s = s.replace(/-/g, '+').replace(/_/g, '/');
  while (s.length % 4) s += '=';
  const bin = atob(s);
  const buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  return buf.buffer;
}
function bufToB64url(buf) {
  const b = new Uint8Array(buf);
  let s = '';
  for (let i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
</script>
</body>
</html>
