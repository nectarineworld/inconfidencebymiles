<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#141210" />
<title>Bloquear · Espacio MILES</title>
<link rel="stylesheet" href="style.css?v=1790347833" />
<link rel="stylesheet" href="admin.css?v=1790347833" />
</head>
<body>

<div class="wrap" style="padding-bottom:100px">
  <h1 class="h1" style="font-size:1.6rem">Días bloqueados</h1>
  <p class="lead">Toca una fecha para bloquearla o desbloquearla. Un día bloqueado no se puede elegir en el formulario público y el servidor rechaza cualquier solicitud para ese día.</p>
  <div id="block-list" class="small-muted" style="margin:0 0 14px"></div>

  <div id="cal-root"></div>

  <div id="action-panel" class="section" hidden>
    <h2>Acción</h2>
    <div id="date-line" style="font-size:14px; margin-bottom:14px"></div>
    <div class="btn-row">
      <button id="btn-block" class="btn btn--primary">Bloquear todo el día</button>
      <button class="btn btn--ghost" onclick="clearSel()">Cancelar</button>
    </div>
    <p class="small-muted">
      Recuerda: solo tú bloqueas fechas. Ningún cliente puede hacerlo.
    </p>
  </div>
</div>

<div id="tabbar-root"></div>

<script src="calendar.js?v=1790347833"></script>
<script src="miles-data.js?v=1790347833"></script>
<script>
  milesMountNav('block');
(async () => {
  await window.milesDataReady;

  // Injecter les blocks dans le calendrier si l'API le permet
  if (typeof MilesCalendar === 'undefined') {
    console.error('calendar.js manquant');
    return;
  }

  const cal = new MilesCalendar(document.getElementById('cal-root'), {
    blockedDates: Array.from(window.MANUAL_BLOCKS || []),
    allowBlockedSelect: true,
    onSelect: (iso) => {
      const panel = document.getElementById('action-panel');
      panel.hidden = false;
      const already = window.MANUAL_BLOCKS.has(iso);
      document.getElementById('date-line').innerHTML =
        `Fecha: <b style="color:var(--color-gold)">${niceDate(iso)}</b> ` +
        (already ? '<span class="badge badge--refused">Actualmente bloqueada</span>' : '<span class="badge badge--confirmed">Disponible</span>');
      const btn = document.getElementById('btn-block');
      btn.textContent = already ? 'Desbloquear este día' : 'Bloquear todo el día';
      btn.onclick = async () => {
        btn.disabled = true;
        btn.textContent = 'Guardando...';
        const ok = await window.milesToggleBlock(iso);
        btn.disabled = false;
        if (ok) {
          // Reload calendar
          cal.setBlockedDates(Array.from(window.MANUAL_BLOCKS));
          renderList();
          const nowBlocked = window.MANUAL_BLOCKS.has(iso);
          btn.textContent = nowBlocked ? 'Desbloquear este día' : 'Bloquear todo el día';
          document.getElementById('date-line').innerHTML =
            `Fecha: <b style="color:var(--color-gold)">${niceDate(iso)}</b> ` +
            (nowBlocked ? '<span class="badge badge--refused">Actualmente bloqueada</span>' : '<span class="badge badge--confirmed">Disponible</span>');
        } else {
          btn.textContent = '✗ Error';
        }
      };
    }
  });

  function renderList() {
    const today = new Date().toISOString().slice(0,10);
    const l = Array.from(window.MANUAL_BLOCKS).filter(x => x >= today).sort();
    document.getElementById('block-list').innerHTML = l.length ? 'Próximos días bloqueados: <b>' + l.map(niceDate).join('</b> · <b>') + '</b>' : 'Ningún día bloqueado próximamente.';
  }
  renderList();
  window.clearSel = function() {
    document.getElementById('action-panel').hidden = true;
  };
})();
</script>
</body>
</html>
