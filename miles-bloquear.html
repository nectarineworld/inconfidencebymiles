<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#141210" />
<title>Bloquear · Espacio MILES</title>
<link rel="stylesheet" href="style.css?v=1790352398" />
<link rel="stylesheet" href="admin.css?v=1790352398" />
</head>
<body>

<div class="wrap" style="padding-bottom:100px">
  <h1 class="h1" style="font-size:1.6rem">Días bloqueados</h1>
  <p class="lead">Toca una fecha y elige qué bloquear: todo MILES, o solo la Sala In Confidence o la Sala Salvaje. Los clientes ven en el calendario público qué está reservado.</p>
  <div id="block-list" class="small-muted" style="margin:0 0 14px"></div>

  <div id="cal-root"></div>

  <div id="action-panel" class="section" hidden>
    <h2>Acción</h2>
    <div id="date-line" style="font-size:14px; margin-bottom:14px"></div>
    <div id="block-controls"></div>
    <div class="btn-row" style="margin-top:10px">
      <button class="btn btn--ghost" onclick="clearSel()">Cerrar</button>
    </div>
    <p class="small-muted">
      Recuerda: solo tú bloqueas fechas. Ningún cliente puede hacerlo.
    </p>
  </div>
</div>

<div id="tabbar-root"></div>

<script src="calendar.js?v=1790352398"></script>
<script src="miles-data.js?v=1790352398"></script>
<script>
  milesMountNav('block');
(async () => {
  await window.milesDataReady;

  // Injecter les blocks dans le calendrier si l'API le permet
  if (typeof MilesCalendar === 'undefined') {
    console.error('calendar.js manquant');
    return;
  }

  const cal = new MilesCalendar(document.getElementById('cal-root'), {
    blockedDates: Array.from(window.MANUAL_BLOCKS || []),
    rooms: window.milesRoomSets(),
    allowBlockedSelect: true,
    light: true,
    onSelect: (iso) => {
      const panel = document.getElementById('action-panel');
      panel.hidden = false;
      document.getElementById('date-line').innerHTML = `Fecha: <b style="color:#8C6A2C">${niceDate(iso)}</b>`;
      window.milesBlockControls(document.getElementById('block-controls'), iso, () => {
        cal.setAll(Array.from(window.MANUAL_BLOCKS), window.milesRoomSets());
        renderList();
      });
      panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  });

  function renderList() {
    const today = new Date().toISOString().slice(0,10);
    const rows = [...window.ROOM_BLOCKS].filter(([d]) => d >= today).sort((x, y) => x[0].localeCompare(y[0]));
    document.getElementById('block-list').innerHTML = rows.length
      ? 'Próximos bloqueos:<br>' + rows.map(([d, set]) => `<b>${niceDate(d)}</b> · ${[...set].map(k => BLOCK_LABELS[k]).join(' + ')}`).join('<br>')
      : 'Ningún bloqueo próximamente.';
  }
  renderList();
  window.clearSel = function() {
    document.getElementById('action-panel').hidden = true;
  };
})();
</script>
</body>
</html>
